<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="sk" aria-hidden="true" hidden></canvas>
<div class="vid" id="vid" hidden><div class="vb" id="vidbox"><div id="vidp"></div><img id="vidi" alt="" hidden></div></div>
<div class="vidc" id="vidc" hidden role="group" aria-label="The camera"><button type="button" id="vW" aria-label="The next camera to the west">west</button><button type="button" id="vE" aria-label="The next camera to the east">east</button><a id="vY" target="_blank" rel="noopener noreferrer" hidden>youtube</a><button type="button" id="vX" aria-label="Close the camera">close</button></div>
<canvas id="ov" aria-hidden="true"></canvas>
<div id="stage" role="application" aria-label="The world. Touch it, drag through it, use more than one finger"></div>

<header class="top" id="top">
  <div class="lead">
  <button class="mark" id="wmenu" type="button" aria-expanded="false" aria-controls="menu" aria-label="Paint. Open the four pages"><span class="mk1">Live Culture</span><span class="mk2"><span class="wname" id="wname">Paint</span><svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg></span></button>
  <button class="ic tlb" id="bTools" type="button" hidden aria-expanded="false" aria-controls="pmenu" aria-label="Paint: its own menu"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.4 4.4h11.2M2.4 8h11.2M2.4 11.6h11.2"/><circle cx="5.4" cy="4.4" r="1.6"/><circle cx="10.6" cy="8" r="1.6"/><circle cx="7" cy="11.6" r="1.6"/></svg></button>
  </div>
  <div class="acts">
    <button class="chip" id="bNow" type="button" hidden aria-label="Return to the present moment">Now</button>
    <button class="chip mode" id="bMode" type="button" aria-label="Music mode: African. Tap for the next mode">African</button>
    <button class="ic mst" id="bSound" type="button" aria-pressed="false" aria-label="Music starts with your first touch. Turn it on now"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 11.6V3.4l6-1.2v8.2"/><circle cx="4.6" cy="11.7" r="1.7"/><circle cx="10.6" cy="10.5" r="1.7"/><path class="sl" d="M2.2 2.2l11.6 11.6"/></svg></button>
  </div>
</header>
<!-- (18 Nov, 00:50: "Theres too many confusing menu items at the bottom ... I like clear windows"; 06:04: "There are only four pages.
     Each has its own menu items. Don't put them on other sections!") the page's name opens the four pages and nothing else; the button
     beside it, on a page that has more than its screen shows, opens that page's own menu and nothing else -->
<div class="menu" id="menu" hidden role="dialog" aria-label="The four pages">
  <nav class="rail" id="rail" aria-label="Pages"></nav>
</div>
<div class="menu pmenu" id="pmenu" hidden role="dialog" aria-label="This page's own menu">
  <p class="pmh" id="pmh">Paint</p>
  <section class="msec" id="ms_paint" hidden aria-label="Paint">
    <button class="mb" id="bPhoto" type="button" aria-label="Use a photo of your own as the paint. It stays on this device"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="4" width="13" height="9.5" rx="2"/><circle cx="8" cy="8.8" r="2.6"/><path d="M5.5 4l1-1.8h3l1 1.8"/></svg><span>your photo</span></button>
    <button class="mb" id="bClear" type="button" hidden aria-label="Take the photo away"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg><span>photo away</span></button>
    <button class="mb" id="bSave" type="button" hidden aria-label="Save a picture of the painting"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.8 7.2L8 10.4l3.2-3.2M2.5 13.5h11"/></svg><span>save a picture</span></button>
    <button class="mb" id="bText" type="button" hidden aria-label="Ask Claude to read what is written on the page, as text"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.4h10M8 3.4v9.8M5.4 13.2h5.2"/></svg><span>to text</span></button>
    <button class="mb" id="bPic" type="button" hidden aria-label="Ask Claude to draw the page again as a quick picture"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6l1.5 4.3 4.3 1.6-4.3 1.6L8 13.4 6.5 9.1 2.2 7.5l4.3-1.6z"/></svg><span>quick image</span></button>
  </section>
  <section class="msec" id="ms_earth" hidden aria-label="Earth"></section>
  <section class="msec" id="ms_beat" hidden aria-label="Beat"></section>
</div>
<p class="data" id="data" aria-live="off"></p>

<aside class="card" id="card" hidden aria-live="polite"></aside>
<div class="zm" id="zm" hidden><button type="button" id="zIn" aria-label="Come closer">+</button><button type="button" id="zOut" aria-label="Go further out">&minus;</button></div>

<footer class="foot" id="foot">
  <div class="lyr thm" id="themes" hidden role="group" aria-label="Kinds of camera"></div>
  <div class="lgd" id="lgd" hidden aria-hidden="true"><b id="lgn"></b><span class="lgw"><i id="lgb"></i><span class="lgs" id="lgs"></span></span></div>
  <div class="dock" id="lyd" hidden role="group" aria-label="Layers of the Earth: tap one to switch it on or off"></div>
  <div class="tools" id="tools" hidden role="toolbar" aria-label="Build in the water"></div>
</footer>
<input class="sr" type="file" id="file" accept="image/*" tabindex="-1" aria-hidden="true">
