<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Live Culture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="format-detection" content="telephone=no,email=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen, a few worlds. The world fills the whole screen edge to edge; the name of the world and its live
   readings sit top left; along the bottom, a row of small circles that are the music (the whole band, then its nine
   players) and under it the worlds. Nothing else.
   Single dark look by choice: these are things that glow. */
:root{
  --abyss:#01040a;
  --ink:#eaf9ff;
  --dim:rgba(234,249,255,.62);
  --faint:rgba(234,249,255,.18);
  --lume:#3ef0ff;
  --warm:#ffb347;
  --pink:#ff2d8a;
  --display:"Anybody","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--abyss);color:var(--ink);font-family:var(--display);overflow:hidden;-webkit-font-smoothing:antialiased;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;margin:0;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--lume);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block;transition:opacity .22s}
#gl{z-index:1;background:var(--abyss)}
#ov{z-index:2;pointer-events:none}
#stage{position:fixed;inset:0;z-index:3;touch-action:none;cursor:crosshair}
body.sw #gl,body.sw #ov,body.sw .vid{opacity:0}
/* Live: the camera's window, under the overlay and over the Earth. Never touched, except when a stream waits for a tap of its own */
.vid{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;transition:opacity .22s}
.vid .vb{position:absolute;left:0;top:0;opacity:0;transition:opacity .7s;background:#000;will-change:transform}
.vid .vb.on{opacity:1}
.vid #vidp,.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
/* the video fills the screen; the readout and the footer sit on a little shade of their own */
.vid::before,.vid::after{content:"";position:absolute;left:0;right:0;z-index:1;pointer-events:none}
.vid::before{top:0;height:150px;background:linear-gradient(to bottom,rgba(1,4,10,.72),rgba(1,4,10,0))}
.vid::after{bottom:0;height:calc(var(--foot,112px) + 60px);background:linear-gradient(to top,rgba(1,4,10,.8) 0,rgba(1,4,10,.55) 55%,rgba(1,4,10,0))}
/* Live: the Earth is drawn over the video, cut to a small round window in the corner (the whole screen when the map is open) */
body.livev .vid{z-index:1}
/* a camera in a window over the Earth: no shading over the stage, the window's own frame is drawn by the page */
body.camw .vid::before,body.camw .vid::after{display:none}
body.livev #gl{z-index:2;-webkit-clip-path:circle(var(--gr,0px) at var(--gx,0px) var(--gy,0px));clip-path:circle(var(--gr,0px) at var(--gx,0px) var(--gy,0px))}
.vid.tap{z-index:4}
.vid.tap .vb{pointer-events:auto;opacity:1}
/* a camera in a window over the Earth (14 Nov: "Videos doesn't seem to really be working"): above everything, so a tap on the picture
   reaches the player itself (a phone may wait for one before it plays), never smaller than YouTube's player allows, and its own row
   of three buttons over it */
body.camw .vid{z-index:5}
body.camw .vid .vb{pointer-events:auto}
.vidc{position:fixed;left:0;top:0;z-index:6;display:flex;gap:6px;will-change:transform}
.vidc[hidden]{display:none}
.vidc button{height:32px;padding:0 13px;border-radius:16px;border:1px solid rgba(234,249,255,.3);background:rgba(1,4,10,.7);color:var(--ink);
  font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.vidc button:active{background:rgba(62,240,255,.2)}
.vidc #vX{margin-left:auto}
/* a little dusk at the top, so the readings can be read over anything bright (a photo, the day side of the Earth) */
body::before{content:"";position:fixed;z-index:4;left:0;right:0;top:0;height:calc(170px + env(safe-area-inset-top,0px));pointer-events:none;
  background:linear-gradient(to bottom,rgba(1,4,10,.62),rgba(1,4,10,.38) 45%,rgba(1,4,10,0))}
body.dropping::after{content:"";position:fixed;inset:10px;z-index:30;border:1px dashed var(--lume);border-radius:14px;pointer-events:none}

/* ---------- top: the name, the readings, the switch ---------- */
.top{position:fixed;z-index:6;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
/* (18 Nov) the world's name is the menu's button: a tap opens the worlds and what this one can do */
.mark{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;pointer-events:auto;padding:4px 8px 4px 0;margin:-4px 0 0;border-radius:10px}
.mark .mk1{font-weight:700;font-variation-settings:"wdth" 122;font-size:9px;line-height:1;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.mark .mk2{display:flex;align-items:center;gap:6px}
.mark .wname{margin:0;font-weight:800;font-variation-settings:"wdth" 62;font-size:34px;line-height:.92;letter-spacing:.01em;text-transform:uppercase;color:var(--ink);white-space:nowrap;
  text-shadow:0 0 22px rgba(1,4,10,.9)}
.mark .chev{width:22px;height:22px;flex:none;padding:4px;border-radius:50%;border:1px solid var(--faint);background:rgba(1,4,10,.55);fill:none;stroke:var(--ink);stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .25s,border-color .25s}
.mark[aria-expanded=true] .chev{transform:rotate(180deg);border-color:var(--lume);stroke:var(--lume)}
.data{position:fixed;z-index:6;margin:0;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));
  font-family:var(--mono);font-size:10px;line-height:1.55;letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--dim));pointer-events:none;
  font-variant-numeric:tabular-nums;max-width:min(64ch,100%);text-shadow:0 0 8px rgba(1,4,10,1),0 0 2px rgba(1,4,10,1);white-space:pre-line;text-wrap:balance}
.acts{flex:0 0 auto;display:flex;align-items:center;gap:8px;pointer-events:auto}
.ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--faint);background:rgba(1,4,10,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);transition:border-color .3s,color .3s,box-shadow .3s}
.ic svg{width:15px;height:15px;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ic:hover,.ic[aria-pressed=true]{border-color:var(--lume);color:var(--lume);box-shadow:0 0 16px -4px var(--lume)}
.chip{height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--warm);background:rgba(1,4,10,.55);color:var(--warm);
  font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
/* ---------- bottom: a world's own row (Paint's tools, the Earth's layers), then the worlds. (There was a row of circles here, one for
   each player; on 13 Nov the owner asked for just a small music on/off button, which is at the top) ---------- */
.foot{position:fixed;z-index:6;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
/* Paint's tools: a labelled row along the bottom, like Wind's layers */
.tools{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;pointer-events:auto;padding:0 4px}
.tb{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px 0 6px;border-radius:14px;border:1px solid rgba(234,249,255,.14);color:var(--dim);background:rgba(1,4,10,.45);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;transition:color .2s,border-color .2s,background .2s}
.tb span{order:2;line-height:1}
.tb svg{order:1;width:14px;height:14px;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.tb[aria-pressed=true]{color:var(--lume);border-color:rgba(62,240,255,.5);background:rgba(62,240,255,.1)}
#t_puz[aria-pressed=true]{color:var(--warm);border-color:rgba(255,190,90,.55);background:rgba(255,190,90,.1)}
@media (max-width:370px){.tb{padding:0 6px 0 5px;gap:3px;letter-spacing:.03em}}
/* a row of small labelled buttons under the picture (the Earth's names of what is happening now, the cameras' kinds) */
.lyr{display:flex;justify-content:center;gap:6px;pointer-events:auto;flex-wrap:wrap;padding:0 8px}
/* a row that is wider than the screen scrolls sideways (Live's themes) */
.lyr.scr{align-self:stretch;max-width:100%;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;touch-action:pan-x;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:0 12px}
.lyr.scr::-webkit-scrollbar{display:none}
/* (17 Nov) the kinds of camera on the site: every one on the screen at once, in as few even rows as fit (as the layers, rule 23);
   14-live.js sets each one's width (--rw) and the row's (--rm) */
.lyr.thm{flex-wrap:wrap;justify-content:center;gap:3px;width:100%;max-width:var(--rm,100%);padding:0}
.lyr.thm .lb{flex:none;width:var(--rw,auto);justify-content:center;padding:0 2px}
.lyr.scr .lb{flex:none}.lyr.scr .lb:first-child{margin-left:auto}.lyr.scr .lb:last-child{margin-right:auto}
.lb{display:flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 8px;border-radius:13px;border:1px solid rgba(234,249,255,.14);color:var(--dim);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;transition:color .25s,border-color .25s,background .25s}
.lb svg{width:13px;height:13px;display:block;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.lb[aria-pressed=true]{color:var(--ink);border-color:rgba(62,240,255,.42);background:rgba(62,240,255,.08)}
/* the Earth's layers (14 Nov, night: "be able to take on and off layers"): a button each, a picture over a word, lit while its layer
   shows (the videos in the red of a live stream). Until 15 Nov, 23:20 they were one row that ran off the side of a phone and had to be
   slid along ("The list of buttons on the globe hardly work. Make everything work"); now every one is on the screen at once, in as few
   rows as fit, the rows even and centred: 12-wind.js sets the width (--dkw), the height (--dkh) and the row's width (--dkm) */
.dock{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;pointer-events:auto;width:100%;max-width:var(--dkm,100%)}
.dk{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:var(--dkw,64px);height:var(--dkh,44px);padding:0 2px;border-radius:12px;
  border:1px solid rgba(234,249,255,.13);background:rgba(1,4,10,.6);color:rgba(234,249,255,.5);font:500 8.5px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;
  overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.dk span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.dock.dkt .dk{font-size:7.5px;letter-spacing:.02em}
.dk svg{width:18px;height:18px;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.dk[aria-pressed=true]{color:var(--ink);border-color:rgba(62,240,255,.55);background:rgba(62,240,255,.14)}
.dk.dk-vid[aria-pressed=true]{border-color:rgba(255,82,82,.75);background:rgba(255,82,82,.16)}
.dk:active{transform:scale(.96)}
/* the scale of the layer of colour shown, over the row */
.lgd{display:flex;align-items:center;gap:8px;width:min(340px,calc(100% - 32px));font:500 8px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);pointer-events:none}
.lgd[hidden]{display:none}
.lgd b{font-weight:500;color:var(--ink);white-space:nowrap}
.lgw{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
#lgb{display:block;height:6px;border-radius:3px}
.lgs{display:flex;justify-content:space-between}
/* the camera's way out to YouTube */
.vidc a{height:32px;padding:0 13px;border-radius:16px;border:1px solid rgba(255,82,82,.55);background:rgba(1,4,10,.7);color:var(--ink);display:flex;align-items:center;
  font:500 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;text-decoration:none}
.vidc a[hidden]{display:none}
.card a.cy{display:inline-flex;align-items:center;margin-top:8px;height:34px;padding:0 14px;border-radius:17px;border:1px solid rgba(255,82,82,.7);background:rgba(255,82,82,.16);
  color:var(--ink);font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
/* the Earth's zoom: two round buttons at the right of the globe, for a thumb */
.zm{position:fixed;right:max(12px,env(safe-area-inset-right,0px));z-index:6;display:flex;flex-direction:column;gap:8px}
.zm[hidden]{display:none}
/* (while a camera's window is open its own buttons are where the zoom's would be: two fingers still come closer) */
body.camw .zm{display:none}
.zm button{width:42px;height:42px;border-radius:21px;border:1px solid rgba(234,249,255,.22);background:rgba(1,4,10,.55);color:var(--ink);font:400 22px/1 var(--mono);display:grid;place-items:center;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.zm button:active{background:rgba(62,240,255,.18)}
/* the music button: a note, warm and lit while the music can be heard, struck through while it cannot */
.mst{color:var(--dim)}
.mst .sl{stroke-width:1.6}
.mst[aria-pressed=true]{color:var(--warm);border-color:var(--warm);box-shadow:0 0 16px -4px var(--warm)}
.mst[aria-pressed=true] svg{filter:drop-shadow(0 0 4px var(--warm))}
.mst[aria-pressed=true] .sl{display:none}
.mst:disabled{opacity:.35}
/* what is on record about a satellite: plain facts in small type, over the lower part of the world */
.card{position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--foot,112px) + 6px);max-width:430px;margin:0 auto;
  padding:11px 13px 9px;border-radius:14px;background:rgba(1,4,10,.74);border:1px solid rgba(234,249,255,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-family:var(--mono);font-size:10px;line-height:1.5;letter-spacing:.03em;color:var(--dim);pointer-events:auto;touch-action:manipulation}
/* (17 Nov, the first hourly run) the card took no touches (pointer-events:none, which its buttons inherited): a finger on its cross or
   on "watch it live on YouTube" went through to the globe under it, so the stream never opened and the card only closed by luck. Now
   the card takes the touches that land on it */
.card .cn{margin:0;font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 70;font-size:19px;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);overflow-wrap:anywhere}
.card .ck{margin:4px 0 7px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--lume)}
/* (18 Nov) what a satellite is for, in one plain sentence, under its kind */
.card .cdo{margin:-2px 0 8px;font-size:10px;line-height:1.45;letter-spacing:.01em;color:var(--ink);text-transform:none}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:1px 10px}
.card dt{color:rgba(234,249,255,.45);text-transform:uppercase;font-size:8.5px;letter-spacing:.12em;padding-top:1.5px;white-space:nowrap}
.card dd{margin:0;color:var(--ink);min-width:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.card .cx{position:absolute;top:2px;right:4px;width:30px;height:30px;color:var(--dim);font-size:18px;line-height:1}
.card canvas{display:block;width:100%;margin:6px 0 0;border-radius:6px}
.card .cd{display:flex;flex-wrap:wrap;gap:2px 12px;margin:6px 0 0;font-size:8.5px;letter-spacing:.1em;color:var(--ink)}
.card .cs{margin:6px 0 0;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:rgba(234,249,255,.35)}
/* (18 Nov) the satellite card: a cross, as on the others; at the top, when more than one satellite was within reach of the finger, the one
   before and the next one; at the bottom, the satellite on N2YO and the place under the finger */
.card .cn{padding-right:26px}
.card .cw{display:flex;align-items:center;gap:4px;height:30px;margin:-9px 0 7px -5px}
.card .cw .st{width:34px;height:30px;border-radius:15px;border:1px solid rgba(234,249,255,.2);color:var(--ink);font-size:17px;line-height:1;display:grid;place-items:center}
.card .cw .hn{min-width:84px;text-align:center;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .ca{display:flex;flex-wrap:wrap;gap:6px 8px;margin:9px 0 1px}
.card .ca a,.card .ca button{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:17px;border:1px solid rgba(234,249,255,.22);background:rgba(234,249,255,.05);
  color:var(--ink);font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.card .ca a.cl{border-color:rgba(62,240,255,.6);background:rgba(62,240,255,.12)}
.card .cw .st:active,.card .ca a:active,.card .ca button:active{background:rgba(62,240,255,.22)}
@media (max-height:480px){
  .mark .wname{font-size:24px}
  .data{top:calc(50px + env(safe-area-inset-top,0px))}
  .foot{gap:2px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .dot{height:24px}
  .card{font-size:9px;padding:8px 11px 7px}
  .card .cn{font-size:15px}
}
/* on a wide screen, and on a phone held sideways, the card stands at the right and the Earth moves over for it */
@media (min-width:760px),(min-width:560px) and (max-height:480px){
  .card{left:auto;right:max(16px,env(safe-area-inset-right,0px));width:min(330px,46vw);margin:0;max-height:calc(100vh - var(--foot,112px) - 14px);overflow:hidden}
}
/* sideways and short: the card is wider and set smaller, and stays clear of the button above it */
@media (min-width:560px) and (max-height:480px){
  .card{width:min(400px,60vw);max-height:calc(100vh - var(--foot,80px) - 58px - env(safe-area-inset-top,0px));font-size:8.5px;line-height:1.38;padding:7px 10px 6px}
  .card .cn{font-size:14px}
  .card .ck{margin:3px 0 4px;font-size:8px}
  .card .cs{display:none}
}
@media (min-width:900px){
  .mark .wname{font-size:46px}
  .data{top:calc(78px + env(safe-area-inset-top,0px));font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){
  #gl,#ov,.ic,.wb,.vid,.vid .vb,.menu,.mark .chev{transition:none}
}

/* ---- the mixer (16-mix.js): the five modes, the band's nine players, then the mode's instruments as cards of two loops; a new mix and
   stop at the foot. All of it on the screen, whatever its size (15 Nov, 20:39, and again at 23:20: "make the music buttons always on
   the page, fit"): 16-mix.js sets --bh, the height of a button, to the most that lets everything fit (46 px at most, 24 at least), and
   the gaps, the corners and the letters follow it. On a screen wider than it is tall the instruments go beside the rest ---- */
#mix{position:fixed;left:0;right:0;z-index:5;display:flex;flex-direction:column;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));
  font-family:var(--mono);color:var(--ink);--bh:40px;--g:clamp(3px,calc(var(--bh) * .14),6px);--fs:clamp(8px,calc(var(--bh) * .25),10.5px)}
#mix[hidden]{display:none}
.mxl{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;display:flex;flex-direction:column;gap:var(--g);width:100%;max-width:560px;margin:0 auto;padding-bottom:6px;
  scrollbar-width:none}
.mxl::-webkit-scrollbar{display:none}
.mxa,.mxi{display:flex;flex-direction:column;gap:var(--g);min-width:0}

/* ---------- what is known of the sky and the air right now: six things measured from orbit or for it.

   wind     the wind ten metres above the whole Earth (NOAA's GFS model, one value per degree)
   aurora   NOAA's forecast of where the aurora is, from the solar wind measured a million miles upstream
   strikes  the lightning of the last half hour, as the GOES weather satellites saw it
   fires    the strongest fires burning in the last 24 hours, as NASA's fire-watching instruments saw their heat (FIRMS)
   storms   the tropical cyclones turning now (NOAA's hurricane centre; GDACS for the rest of the world)
   The page cannot reach the internet. It carries the set it was published with (data/live.json, next to the page) and watches
   its own store: a small stamp there says how new each of them is, and only a newer one is fetched. ---------- */

/* the heartbeat can never stop: if one frame ever trips, the next is still asked for */
